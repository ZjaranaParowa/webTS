<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektro-Bud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Elektro-Bud</h1>
        <h2>Dodawanie produktu</h2>

        <form id="formularz">
            <label for="ean">Kod EAN:</label>
            <input type="text" id="ean" required>

            <label for="nazwa">Nazwa produktu:</label>
            <input type="text" id="nazwa" required>

            <label for="kategoria">Kategoria:</label>
            <input type="text" id="kategoria" required>

            <h3>Lokalizacja w magazynie</h3>

            <label for="sektor">Sektor:</label>
            <input type="text" id="sektor" required>

            <label for="regal">Regał:</label>
            <input type="text" id="regal" required>

            <label for="polka">Półka:</label>
            <input type="text" id="polka" required>

            <label for="ilosc">Ilość początkowa:</label>
            <input type="number" id="ilosc" required>

            <button type="submit">Dodaj towar</button>
        </form>
        <p id="komunikat"></p>
        <h2>Lista towarów</h2>
        <table>
            <thead>
                <tr>
                    <th>EAN</th>
                    <th>Nazwa</th>
                    <th>Kategoria</th>
                    <th>Lokalizacja</th>
                    <th>Ilość</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </main>
    <script src="main.js"></script>
</body>
</html>
