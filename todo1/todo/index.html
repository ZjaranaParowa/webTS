<!DOCTYPE html>
<html>
    <head>
        <title>Todo App</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-dark">
        <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center p-0">
            <div id="app" class="card shadow-sm rounded-0 overflow-auto" style="width: 375px; height: 100vh;">
                <div class="card-body p-4">
                    <h1 class="h2 mb-4">Co masz dzisiaj zrobić?</h1>
                    <div class="mb-3">
                        <label for="todoInputField" class="form-label">Dodaj zadanie</label>
                        <input type="text" id="todoInputField" class="form-control" placeholder="Wpisz zadanie">
                    </div>
                    <button type="button" id="todoAddButton" class="btn btn-primary w-100">Dodaj zadanie</button>
                    <div id="todoContainer" class="mt-4"></div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script type="module" src="public/main.js" defer></script>
        <script  ></script>
    </body>
</html>
